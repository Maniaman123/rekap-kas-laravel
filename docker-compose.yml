services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rekap-kas-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - APP_ENV=production
    networks:
      - kas-network

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rekap-kas-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://app:8080
    depends_on:
      - app
    networks:
      - kas-network

networks:
  kas-network:
    driver: bridge

